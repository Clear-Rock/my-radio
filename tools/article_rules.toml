# 除外を先に適用し、次に優先条件を確認する。
# 優先候補がなければ、除外に当たらない記事のうち最も重要なものを本文で選ぶ。
# 適格な候補がない枠は、理由を添えて省略する。
# 正規表現は見出しとURLパスで明示的に判断できる項目だけを扱う。
days = 7

[exclude_hints]
"セール・値引き" = '/todays_sales/|セール|値引き|値下げ|最安値|最安更新|最安値級|最安級|特価|お買い得|激安|割引|スマイルSale|[0-9０-９]+(?:万)?円引き|[0-9０-９]+[%％](?:オフ|OFF)|\b(?:sale|discount)\b'

[slots.top]
priority = "採用済みの全情報源から、本文を確認して当日最も重要な記事を選ぶ。個人を特定できる事件・事故は避ける"
priority_hint = '(?!)'
[slots.top.exclude_hints]
"事件・事故" = '逮捕|容疑者|死亡事故|事件の被害者'

[slots.ai]
site = "PC Watch"
feeds = [
  "https://pc.watch.impress.co.jp/data/rss/1.0/pcw/feed.rdf",
  "https://forest.watch.impress.co.jp/data/rss/1.0/wf/feed.rdf",
  "https://akiba-pc.watch.impress.co.jp/data/rss/1.0/ah/feed.rdf",
  "https://av.watch.impress.co.jp/data/rss/1.0/avw/feed.rdf",
  "https://k-tai.watch.impress.co.jp/data/rss/1.0/ktw/feed.rdf"
]
required_hint = '(?<![A-Za-z0-9])(?:AI|LLM|ChatGPT|Claude|Gemini|Copilot|Ollama|GPT[- ]?[0-9]+)(?![A-Za-z0-9])|生成AI|人工知能|言語モデル|オープンウェイト|AIエージェント|AI秘書'
priority = "ローカルLLM、AIの実用機能"
priority_hint = 'ローカルLLM|オンデバイス|重み公開|(?:ローカル|端末上)(?:で|実行)|(?:AI|Claude|Gemini|ChatGPT).{0,24}(?:機能|対応|編集|翻訳|検索|対話)'
exclude = "企業の業績、広告色の強い記事"
[slots.ai.exclude_hints]
"企業業績" = '決算発表|増収増益|減収減益|業績予想|四半期決算'
"広告表示" = '\[Sponsored\]|【PR】|\[PR\]|広告企画|タイアップ広告'

[slots.pc]
site = "PC Watch"
feeds = [
  "https://pc.watch.impress.co.jp/data/rss/1.0/pcw/feed.rdf",
  "https://forest.watch.impress.co.jp/data/rss/1.0/wf/feed.rdf",
  "https://akiba-pc.watch.impress.co.jp/data/rss/1.0/ah/feed.rdf",
  "https://av.watch.impress.co.jp/data/rss/1.0/avw/feed.rdf",
  "https://k-tai.watch.impress.co.jp/data/rss/1.0/ktw/feed.rdf"
]
priority = "GPU・CPU、自作PC、スマホ、イヤホン、ミニPC、周辺機器"
priority_hint = '\b(?:GPU|CPU|Ryzen|GeForce|RTX|Core i[3579])\b|自作PC|スマホ|イヤホン|ミニPC|周辺機器|キーボード|モニター|マウス'
exclude = "セール、広告色の強い記事、配信番組の紹介"
[slots.pc.exclude_hints]
"広告表示" = '\[Sponsored\]|【PR】|\[PR\]|広告企画|タイアップ広告'
"配信番組" = '配信番組|生配信|生放送|ガチくんに!'

[slots.games]
site = "AUTOMATON"
feeds = [
  "https://automaton-media.com/feed/",
  "https://game.watch.impress.co.jp/data/rss/1.0/gmw/feed.rdf",
  "https://www.4gamer.net/rss/index.xml"
]
priority = "FF、ペルソナ、ロックマン、フロム作品、ガンダム。同じ条件ならSteam対応を優先"
tie_break_hint = '(?<![A-Za-z0-9])Steam(?![A-Za-z0-9])'
priority_hint = '(?<![A-Za-z0-9])FF(?:[0-9]+|[IVX]+)?(?![A-Za-z0-9])|ファイナルファンタジー|ペルソナ|ロックマン|フロム・ソフトウェア|エルデンリング|ELDEN RING|アーマード[・ ]?コア|ARMORED CORE|ダークソウル|DARK SOULS|ブラッドボーン|Bloodborne|SEKIRO|デモンズソウル|ガンダム'
exclude = "スマホ専用、噂・リーク、課金やコラボの細かい告知。PCや家庭用機でも遊べる作品はスマホ版があっても対象"
[slots.games.exclude_hints]
"スマホ専用" = 'スマ(?:ホ|ートフォン)(?:向け)?(?:専用|限定)|(?:iOS|Android)(?:向け)?専用'
"噂・リーク" = 'との噂|という噂|リーク(?:情報|による|された|か[。！？])'

[slots.hobby]
site = "HOBBY Watch"
feeds = ["https://hobby.watch.impress.co.jp/data/rss/1.0/hbw/feed.rdf"]
required_hint = 'ガンプラ|ガンダム|プラモ|フィギュア|可動モデル|ねんどろいど|S\.H\.Figuarts|figma'
priority = "ガンプラ、アクションフィギュア、スケールフィギュア"
priority_hint = 'ガンプラ|ガンダム|頑駄無|(?<![A-Za-z0-9])(?:HG|MG|RG|PG|SD)(?![A-Za-z0-9]).{0,12}1/(?:144|100)(?![0-9])|アクションフィギュア|可動フィギュア|スケールフィギュア|(?<![0-9])1/(?:[0-9]+スケール|[47](?![0-9]))|S\.H\.(?:Figuarts|MonsterArts)|ROBOT\s*魂|figma'
exclude = "セール、トイガン、ガチャ・くじ、広告色の強い記事"
[slots.hobby.exclude_hints]
"トイガン" = 'トイガン|エアガン|エアソフト|ガスガン|電動ガン|サバゲー'
"ガチャ・くじ" = 'ガチャ|ガシャ|カプセルトイ|一番くじ|くじ'
"広告表示" = '\[Sponsored\]|【PR】|\[PR\]|広告企画|タイアップ広告'

[slots.anime]
hold_reason = "MANGA Watchの公式RSSに直近7日以内のアニメを主題とする記事がなく、アニメ！アニメ！は公開番組での利用条件を確認できないため保留"
priority = "ガンダム、放送中の話題作、劇場版アニメ"
exclude = "グッズ、くじ、コラボ商品、配信サイトの案内、ネタバレ、噂"

[feed_sites]
"https://forest.watch.impress.co.jp/data/rss/1.0/wf/feed.rdf" = "窓の杜"
"https://akiba-pc.watch.impress.co.jp/data/rss/1.0/ah/feed.rdf" = "AKIBA PC Hotline!"
"https://av.watch.impress.co.jp/data/rss/1.0/avw/feed.rdf" = "AV Watch"
"https://k-tai.watch.impress.co.jp/data/rss/1.0/ktw/feed.rdf" = "ケータイ Watch"
"https://game.watch.impress.co.jp/data/rss/1.0/gmw/feed.rdf" = "GAME Watch"
# 4Gamerの記事へのリンクは非商用の範囲で利用する。
"https://www.4gamer.net/rss/index.xml" = "4Gamer"
